<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b62"><link rel="manifest" href="manifest.webmanifest"><title>WH Digital – Meine Aufgaben</title><style>body{font:18px system-ui;margin:0;background:#f3f6fa;color:#172b40}header{background:#123b62;color:white;padding:20px}header b{font-size:25px}main{max-width:650px;margin:auto;padding:16px}section,.task{background:white;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #0001}button,input,textarea{font:inherit}button{background:#1767a7;color:white;border:0;border-radius:10px;padding:13px;margin:4px;cursor:pointer}button.secondary{background:#e5edf5;color:#173c5d}button.danger{background:#a52c38}textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bac7d4;border-radius:10px;min-height:85px}img.preview{max-width:100%;max-height:210px;border-radius:10px}.task.done{opacity:.7}.task.done .body{text-decoration:line-through}.actions{display:flex;flex-wrap:wrap;align-items:center}.muted{color:#56677a;font-size:14px}h2{font-size:21px}input[type=file]{display:none}label.file{display:inline-block;background:#e5edf5;color:#173c5d;padding:13px;border-radius:10px;margin:4px;cursor:pointer}#status{font-size:14px;color:#345}</style></head><body><header><b>WH <span style="color:#75d5fa">digital</span></b><div>Meine Aufgaben</div></header><main><section><h2>Neue Aufgabe</h2><textarea id="entry" placeholder="Was ist zu erledigen?"></textarea><div class="actions"><button id="voice">🎤 Sprechen</button><label class="file" for="photo">📷 Foto</label><input id="photo" type="file" accept="image/*" capture="environment"><button id="save">＋ Speichern</button></div><div id="photoInfo" class="muted"></div><div id="status" role="status"></div></section><section><h2>Offen (<span id="openCount">0</span>)</h2><div id="open"></div></section><section><h2>Erledigt (<span id="doneCount">0</span>)</h2><div id="done"></div><button class="danger" id="clearDone">Erledigte löschen</button></section><section><h2>Datensicherung</h2><p class="muted">Export und Import enthalten Aufgaben und Fotos. Die Datei sicher aufbewahren.</p><button id="export" class="secondary">⬇ Sicherung erstellen</button><label class="file" for="import">⬆ Sicherung einlesen</label><input id="import" type="file" accept="application/json,.json"><p class="muted">Daten liegen nur in diesem Browserprofil auf diesem Gerät. Browserdaten nicht löschen.</p></section></main><script>
const $=id=>document.getElementById(id);let db,pending=null;const req=indexedDB.open('wh-digital-todos',1);req.onupgradeneeded=()=>req.result.createObjectStore('tasks',{keyPath:'id'});req.onsuccess=()=>{db=req.result;render()};req.onerror=()=>alert('Lokaler Speicher nicht verfügbar.');function store(mode='readonly'){return db.transaction('tasks',mode).objectStore('tasks')}function all(){return new Promise((resolve,reject)=>{let r=store().getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function put(t){return new Promise((resolve,reject)=>{let r=store('readwrite').put(t);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}function del(id){return new Promise((resolve,reject)=>{let r=store('readwrite').delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}function compress(file){return new Promise((resolve,reject)=>{let im=new Image(),url=URL.createObjectURL(file);im.onload=()=>{let ratio=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.75))};im.onerror=()=>reject(Error('Bild konnte nicht geladen werden'));im.src=url})} $('photo').onchange=async e=>{try{let f=e.target.files[0];if(f){pending=await compress(f);$('photoInfo').textContent='Foto ausgewählt: '+f.name}}catch(err){alert(err.message)}};$('save').onclick=async()=>{if(!db)return;let text=$('entry').value.trim();if(!text&&!pending)return alert('Bitte Text oder Foto hinzufügen.');try{await put({id:crypto.randomUUID(),text,photo:pending,done:false,created:Date.now()});$('entry').value='';$('photo').value='';$('photoInfo').textContent='';pending=null;render()}catch(e){alert('Speichern fehlgeschlagen: Speicherplatz prüfen.')}};async function render(){let tasks=(await all()).sort((a,b)=>b.created-a.created);for(let [name,done] of [['open',false],['done',true]]){let items=tasks.filter(t=>t.done===done),root=$(name);root.replaceChildren();$(name+'Count').textContent=items.length;if(!items.length){let p=document.createElement('p');p.className='muted';p.textContent=done?'Noch keine erledigten Aufgaben.':'Keine offenen Aufgaben.';root.append(p)}for(let t of items){let el=document.createElement('div');el.className='task'+(done?' done':'');let body=document.createElement('div');body.className='body';body.textContent=t.text||'Foto-Aufgabe';el.append(body);if(t.photo){let img=document.createElement('img');img.src=t.photo;img.className='preview';img.alt='Foto zur Aufgabe';el.append(img)}let actions=document.createElement('div');actions.className='actions';let toggle=document.createElement('button');toggle.textContent=done?'↩ Wieder öffnen':'✓ Erledigt';toggle.onclick=async()=>{t.done=!t.done;await put(t);render()};actions.append(toggle);if(done){let remove=document.createElement('button');remove.className='danger';remove.textContent='Löschen';remove.onclick=async()=>{if(confirm('Aufgabe endgültig löschen?')){await del(t.id);render()}};actions.append(remove)}el.append(actions);root.append(el)}}}$('clearDone').onclick=async()=>{let tasks=(await all()).filter(t=>t.done);if(tasks.length&&confirm(tasks.length+' erledigte Aufgaben endgültig löschen?')){for(let t of tasks)await del(t.id);render()}};$('export').onclick=async()=>{let data=JSON.stringify({app:'wh-digital-todos',version:1,tasks:await all()}),url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='wh-digital-aufgaben-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.app!=='wh-digital-todos'||!Array.isArray(data.tasks)||!data.tasks.every(t=>typeof t.id==='string'&&typeof t.text==='string'&&typeof t.done==='boolean'&&(!t.photo||typeof t.photo==='string')))throw Error('Ungültige Sicherungsdatei');if(confirm(data.tasks.length+' Aufgaben importieren? Vorhandene Aufgaben bleiben erhalten.')){for(let t of data.tasks)await put(t);render()}}catch(err){alert('Import fehlgeschlagen: '+err.message)}e.target.value=''};let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voice').onclick=()=>alert('Spracherkennung hier nicht verfügbar. Nutze das Mikrofon der Android-Tastatur.')}else{$('voice').onclick=()=>{let r=new SR();r.lang='de-DE';r.interimResults=false;$('status').textContent='Bitte jetzt sprechen …';r.onresult=e=>{$('entry').value+=($('entry').value?' ':'')+e.results[0][0].transcript;$('status').textContent='Sprache erkannt.'};r.onerror=()=>{$('status').textContent='Spracherkennung fehlgeschlagen. Alternativ Tastaturmikrofon nutzen.'};r.onend=()=>{if($('status').textContent==='Bitte jetzt sprechen …')$('status').textContent='Aufnahme beendet.'};r.start()}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
