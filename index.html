<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0057b8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>WH Digital Todos</title>
<style>
:root{--blue:#0057b8;--blue-dark:#003d80;--bg:#f2f5f9;--card:#fff;--text:#1a1a1a;--muted:#6b7280;--danger:#d32f2f;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:96px}
header{background:var(--card);padding:14px 16px calc(14px);display:flex;align-items:center;gap:12px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10}
header img{height:44px;width:44px;border-radius:10px;object-fit:cover}
header h1{font-size:18px;color:var(--blue-dark)}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:8px 2px 10px}
.stats{font-size:13px;color:var(--muted);margin:-4px 2px 12px}
ul#liste{list-style:none;display:flex;flex-direction:column;gap:10px}
li.todo{background:var(--card);border-radius:var(--radius);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 1px 3px rgba(0,0,0,.08)}
li.todo input[type=checkbox]{width:26px;height:26px;flex:none;margin-top:2px;accent-color:var(--blue)}
.todo-body{flex:1;min-width:0}
.todo-text{word-break:break-word;white-space:pre-wrap}
li.done .todo-text{text-decoration:line-through;color:var(--muted)}
.todo-meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
audio{width:100%;max-width:280px;height:36px;margin-top:6px}
.thumb{max-width:120px;max-height:120px;border-radius:8px;margin-top:6px}
.btn-del{border:none;background:none;color:var(--danger);font-size:22px;line-height:1;padding:4px 8px;flex:none}
.leer{color:var(--muted);text-align:center;padding:32px 0;font-size:15px}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid #e2e8f0;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
#eingabe{flex:1;border:1px solid #d1d5db;border-radius:var(--radius);padding:12px 14px;font-size:16px;background:#fff;color:var(--text)}
.rund{width:48px;height:48px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none}
.rund:active{background:var(--blue-dark)}
.rund.rot{background:var(--danger)}
.rund.rot:active{background:#9a1b1b}
#aufnahmeHinweis{display:none;max-width:640px;margin:10px auto 0;font-size:13px;color:var(--danger);text-align:center}
dialog{border:none;border-radius:16px;padding:20px;max-width:340px;width:90%;text-align:center}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog img{width:100%;border-radius:8px;margin:12px 0}
dialog .actions{display:flex;gap:10px;margin-top:12px}
dialog button{flex:1;padding:12px;border-radius:12px;border:none;font-size:15px}
#dlgOk{background:var(--blue);color:#fff}
#dlgLoeschen{background:#eee;color:var(--text)}
</style>
</head>
<body>
<header>
  <img src="icons/icon-192.png" alt="WH Digital Logo">
  <h1>WH Digital<br><span style="font-size:13px;font-weight:400">Todos</span></h1>
</header>
<main>
  <h2>Offene Aufgaben</h2>
  <p class="stats" id="stats"></p>
  <ul id="liste"></ul>
  <p class="leer" id="leer" hidden>Keine Aufgaben. Füge unten eine hinzu – durch Tippen, Sprechen oder Foto.</p>
  <h2 style="margin-top:24px" id="fertigUeberschrift" hidden>Erledigt</h2>
  <ul id="listeFertig"></ul>
</main>
<footer>
  <div class="bar">
    <input id="eingabe" type="text" placeholder="Aufgabe tippen…" enterkeyhint="done" autocomplete="off">
    <button class="rund" id="btnFoto" title="Foto" aria-label="Foto aufnehmen">📷</button>
    <button class="rund" id="btnSpeech" title="Diktieren" aria-label="Aufnahme starten">🎙️</button>
    <button class="rund" id="btnAdd" title="Hinzufügen" aria-label="Aufgabe hinzufügen">＋</button>
  </div>
  <p id="aufnahmeHinweis"></p>
</footer>
<dialog id="fotoDialog">
  <strong>Foto aufnehmen</strong>
  <input type="file" id="fotoInput" accept="image/*" capture="environment" style="margin-top:12px">
  <img id="fotoVorschau" alt="" hidden>
  <input type="text" id="fotoText" placeholder="Beschreibung (optional)" style="width:100%;margin-top:10px;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:16px">
  <div class="actions">
    <button id="dlgLoeschen">Verwerfen</button>
    <button id="dlgOk">Speichern</button>
  </div>
</dialog>
<script src="app.js"></script>
</body>
</html>
